services:

  frontend:
    build:
      context: ./apps/plantilla-front
      dockerfile: Dockerfile

    container_name: plantilla-frontend

    volumes:
      - ./apps/plantilla-front:/app
      - /app/node_modules

    ports:
      - "3005:80"

    environment:
      NODE_ENV: development
      PORT: 80

    networks:
      - plantilla_network


  php:
    build:
      context: ./apps/plantilla
      dockerfile: Dockerfile

    container_name: plantilla_php

    volumes:
      - ./apps/plantilla:/var/www

    working_dir: /var/www

    command:
      - sh
      - -lc
      - |
        find storage bootstrap/cache -type d -exec chmod 777 {} \;
        find storage bootstrap/cache -type f -exec chmod 666 {} \;
        exec php-fpm -d opcache.revalidate_freq=60 -d opcache.max_accelerated_files=20000

    depends_on:
      - pgsql
      - redis
      - mongodb

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: plantilla
      DB_USERNAME: postgres
      DB_PASSWORD: irwin

      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017

      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - plantilla_network


  nginx:
    image: nginx:alpine

    container_name: plantilla_nginx

    ports:
      - "8005:80"

    volumes:
      - ./apps/plantilla:/var/www
      - ./apps/plantilla/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

    networks:
      - plantilla_network


  pgsql:
    image: postgres:17-alpine

    container_name: plantilla_db

    ports:
      - "5437:5432"

    environment:
      POSTGRES_DB: plantilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: irwin

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - plantilla_network


  redis:
    image: redis:alpine

    container_name: plantilla_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - plantilla_network


  mongodb:
    image: mongo:4.4-bionic

    container_name: plantilla_mongo

    ports:
      - "27018:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - plantilla_network


volumes:
  postgres_data:
  redis_data:
  mongo_data:


networks:
  plantilla_network:
    driver: bridge